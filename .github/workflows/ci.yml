name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint with ruff
        run: python -m ruff check . --output-format=github
        continue-on-error: true

      - name: Compile-check all Python modules
        run: python -m compileall -q src app.py

      - name: Import-check application modules
        run: |
          python -c "
          import src.cases, src.config, src.detectors, src.geoip, src.intelligence
          import src.ioc, src.monitor, src.reports, src.reputation, src.story, src.utils
          print('src package imports OK')
          "

      - name: Run test suite
        env:
          OPENAI_API_KEY: ""
          VT_API_KEY: ""
          ABUSEIPDB_API_KEY: ""
        run: python -m pytest tests/ -v --tb=short
